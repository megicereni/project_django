<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm p-4">

        <h3>Booking Detail</h3>

        <hr>

        <p><strong>Client:</strong> {{ booking.client.name }}</p>
        <p><strong>Package:</strong> {{ booking.package.general_package.title }}</p>
        <p><strong>People:</strong> {{ booking.numberOfPeople }}</p>
        <p><strong>Total Price:</strong> ${{ booking.totalPrice }}</p>

        <p>
            <strong>Status:</strong>
            <span class="badge bg-secondary">{{ booking.status }}</span>
        </p>

        <hr>

        <!-- ACTION BUTTONS -->
        <div class="d-flex gap-2">

            <!-- CONFIRM -->
            <form method="POST" action="{% url 'booking_confirm' booking.id %}">
                {% csrf_token %}
                <button class="btn btn-success">
                    Confirm
                </button>
            </form>

            <!-- CANCEL -->
            <form method="POST" action="{% url 'booking_cancel' booking.id %}">
                {% csrf_token %}
                <button class="btn btn-warning">
                    Cancel
                </button>
            </form>

            <!-- REFUND -->
            <form method="POST" action="{% url 'booking_refund' booking.id %}">
                {% csrf_token %}
                <button class="btn btn-danger">
                    Refund
                </button>
            </form>

        </div>

        <a href="{% url 'booking_list' %}" class="btn btn-secondary mt-3">
            Back
        </a>

    </div>

</div>

</body>
</html>
