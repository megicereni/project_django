{% extends template/base.html %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .container-box {
            margin-left: 260px;
            padding: 40px;
        }

        .booking-card {
            border-radius: 12px;
            transition: 0.2s;
        }

        .booking-card:hover {
            transform: translateY(-3px);
        }

        .status {
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .pending { background: #fff3cd; color: #856404; }
        .approved { background: #d1e7dd; color: #0f5132; }
        .rejected { background: #f8d7da; color: #842029; }
    </style>
</head>

<body>

<div class="container-box">

    <h2 class="mb-4">Bookings</h2>

    <div class="row">

        {% for b in bookings %}

        <div class="col-md-4 mb-4">

            <div class="card shadow-sm booking-card p-3">

                <h5>{{ b.client.name }}</h5>

                <p class="mb-1">
                    <strong>Package:</strong> {{ b.package.general_package.title }}
                </p>

                <p class="mb-1">
                    <strong>People:</strong> {{ b.numberOfPeople }}
                </p>

                <p class="mb-1">
                    <strong>Total:</strong> ${{ b.totalPrice }}
                </p>

                <a href="{% url 'booking_detail' b.id %}"
                   class="btn btn-primary btn-sm mt-3">
                    View Details
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
