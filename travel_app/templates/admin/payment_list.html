<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .container-box {
            max-width: 1100px;
            margin: 40px auto;
        }

        .card {
            border: none;
            border-radius: 12px;
        }

        table th {
            background: #111827;
            color: white;
        }
    </style>
</head>

<body>

<div class="container-box">

    <h2 class="mb-4">Payments List</h2>

    <div class="card shadow-sm">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <thead>
                    <tr>
                        <th>Client</th>
                        <th>Booking ID</th>
                        <th>Amount</th>
                        <th>Refunded</th>
                        <th>Created At</th>
                    </tr>
                </thead>

                <tbody>

                {% for payment in payments %}

                    <tr>

                        <td>
                            {{ payment.booking.client.name }}
                        </td>

                        <!-- BOOKING -->
                        <td>
                            #{{ payment.booking.id }}
                        </td>

                        <!-- AMOUNT -->
                        <td>
                            ${{ payment.amount }}
                        </td>

                        <!-- REFUNDED -->
                        <td>
                            ${{ payment.refundedAmount }}
                        </td>

                        <!-- DATE -->
                        <td>
                            {{ payment.created_at|date:"Y-m-d H:i" }}
                        </td>

                        <td>
                            {{ payment.booking.package.title}}
                        </td>
                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
