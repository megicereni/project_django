{% extends "base.html" %}
{% block title %} Newsletter {% endblock %}

{% block content %}

<div class="container py-4">
    <div class="card p-4" style="max-width: 500px; margin: auto;">

        <h2 class="text-center mb-4" style="font-weight: 700;">
            Send Newsletter
        </h2>

        <form method="post" action="{% url 'send_newsletter' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Subject</label>
                {{ form.subject }}
            </div>

            <div class="mb-3">
                <label class="form-label">Message</label>
                {{ form.message }}
            </div>

            <button type="submit" class="login-button w-100">
                Send Newsletter
            </button>
        </form>

    </div>
</div>

{% endblock %}
