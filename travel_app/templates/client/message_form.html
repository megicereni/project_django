{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <h2>Contact Mia Travel</h2>
{% if messages %}
{% for message in messages %}
<div class="alert alert-{{ message.tags }}">
    {{ message }}
</div>
{% endfor %}
{% endif %}
    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Your Message</label>
            {{ form.message }}
        </div>

        <button type="submit" class="btn btn-primary">
            Send Message
        </button>
    </form>
</div>
{% endblock %}
